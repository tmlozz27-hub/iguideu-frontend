<!doctype html><meta charset="utf-8" />
<title>I GUIDE U – Checkout (Test)</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial;margin:2rem;max-width:720px}
  pre{background:#111;color:#0f0;padding:12px;overflow:auto;white-space:pre-wrap}
  button{font-size:1rem;padding:.6rem 1rem}
</style>
<h1>I GUIDE U – Checkout</h1>
<p>Pago de prueba con Stripe (USD 10.00)</p>
<button id="pay">Pagar USD 10</button>
<pre id="out">Listo para probar.</pre>

<script>
const out = document.getElementById('out');
const btn = document.getElementById('pay');

// 1) calcula tres bases posibles
const ORIGIN = location.origin;                              // ej: http://localhost:5178 o http://192.168.0.4:5178
const GUESS_127 = ORIGIN.replace(/:\d+$/, ':4020').replace('//192.168.0.4', '//127.0.0.1');
const GUESS_LAN = ORIGIN.replace(/:\d+$/, ':4020').replace('//localhost', '//192.168.0.4').replace('//127.0.0.1','//192.168.0.4');
const BASES = Array.from(new Set([GUESS_127, GUESS_LAN, ORIGIN.replace(/:\d+$/, ':4020')]));

function log(x){ out.textContent += (out.textContent ? '\n' : '') + x; }

async function fetchWithTimeout(url, opts={}, ms=6000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort('timeout'), ms);
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

async function tryCreateSession() {
  out.textContent = 'Probando endpoints...\n';
  // 2) testea /api/health en cada base para saber cuál responde
  let baseOk = null, healthJson = null;
  for (const b of BASES) {
    try {
      const r = await fetchWithTimeout(`${b}/api/health`, { credentials:'omit' }, 4000);
      const j = await r.json();
      log(`✔️ HEALTH OK en ${b} => ${JSON.stringify(j)}`);
      baseOk = b; healthJson = j; break;
    } catch(e){
      log(`❌ HEALTH falla en ${b}: ${e}`);
    }
  }
  if (!baseOk) throw new Error('Ningún /api/health respondió. (Server caído o firewall)');

  // 3) crea checkout en la base que respondió
  log(`\nCreando sesión en ${baseOk}/api/payments/create-checkout ...`);
  try {
    const r = await fetchWithTimeout(`${baseOk}/api/payments/create-checkout`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ amount:1000, currency:'usd', description:'I GUIDE U – Test USD 10.00' })
    }, 9000);

    const text = await r.text();
    log(`HTTP ${r.status} ${r.statusText} => ${text}`);
    let j; try { j = JSON.parse(text); } catch(_) {}
    if (j?.ok && j?.url) {
      log('Redirigiendo a Stripe Checkout...');
      location.href = j.url; return;
    } else {
      throw new Error('Respuesta sin url. Ver log arriba.');
    }
  } catch(e) {
    log('❌ Error en create-checkout: ' + e);
    throw e;
  }
}

btn.onclick = async ()=>{
  btn.disabled = true;
  out.textContent = 'Cargando pago...';
  try { await tryCreateSession(); }
  catch(e){ log('\n⚠️ Revisá la ventana del SERVER y que /api/health esté en 200.'); }
  finally { btn.disabled = false; }
};
</script>
